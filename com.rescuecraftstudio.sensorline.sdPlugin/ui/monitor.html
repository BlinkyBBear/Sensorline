<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sensorline</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; font-size: 12px; color: #ccc; background: #2d2d2d; margin: 0; padding: 12px; }
    .wrap { display: flex; flex-direction: column; gap: 9px; }
    .item { display: flex; align-items: center; justify-content: space-between; }
    .label { margin-right: 12px; color: #969696; font-size: 11px; }
    .value { flex: 1; display: flex; justify-content: flex-end; }
    input[type="color"] { width: 72px; padding: 0 2px; }
    [hidden] { display: none !important; }
    input, select { height: 26px; box-sizing: border-box; background: #3d3d3d; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 0 6px; font-size: 12px; }
    input[type="number"] { width: 72px; }
    input[type="text"] { width: 110px; }
    select { width: 150px; }
    .hint { font-size: 10px; color: #777; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="label">Style</div><div class="value">
      <select id="style"><option value="radial">Radial</option><option value="bar">Bar</option><option value="value">Value</option><option value="sparkline">Sparkline</option></select>
    </div></div>
    <div class="item"><div class="label">Label</div><div class="value"><input id="label" type="text" maxlength="8" /></div></div>
    <div class="item"><div class="label">Cold below</div><div class="value"><input id="cold" type="number" step="any" /></div></div>
    <div class="item"><div class="label">High from</div><div class="value"><input id="warn" type="number" step="any" /></div></div>
    <div class="item"><div class="label">Critical from</div><div class="value"><input id="crit" type="number" step="any" /></div></div>
    <div class="item"><div class="label">Palette</div><div class="value"><select id="palette"><option value="default">Default</option><option value="colourblind">Colour-blind safe</option><option value="custom">Custom</option></select></div></div>
    <div class="item"><div class="label">Gradient</div><div class="value"><select id="gradient"><option value="smooth">Smooth</option><option value="stepped">Stepped</option></select></div></div>
    <div class="item custom"><div class="label">Cold colour</div><div class="value"><input id="colCold" type="color" value="#2f7bff" /></div></div>
    <div class="item custom"><div class="label">Normal colour</div><div class="value"><input id="colNormal" type="color" value="#2ecc71" /></div></div>
    <div class="item custom"><div class="label">High colour</div><div class="value"><input id="colHigh" type="color" value="#f5c400" /></div></div>
    <div class="item custom"><div class="label">Critical colour</div><div class="value"><input id="colCrit" type="color" value="#ff3b30" /></div></div>
    <div class="item"><div class="label">Refresh (ms)</div><div class="value"><input id="intervalMs" type="number" min="250" max="5000" step="50" /></div></div>
    <div class="hint">This key picks the matching AIDA64 sensor itself. Enable External Applications sharing in AIDA64, then drop the key on the deck.</div>
  </div>
  <script>
    var websocket = null, uuid = null, settings = {};
    var fields = ["style", "label", "cold", "warn", "crit", "palette", "gradient", "colCold", "colNormal", "colHigh", "colCrit", "intervalMs"];
    function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info, actionInfoStr) {
      uuid = pluginUUID;
      settings = (JSON.parse(actionInfoStr).payload || {}).settings || {};
      apply();
      websocket = new WebSocket("ws://127.0.0.1:" + port);
      websocket.onopen = function () { websocket.send(JSON.stringify({ event: registerEvent, uuid: pluginUUID })); };
      websocket.onmessage = function (evt) {
        var data = JSON.parse(evt.data);
        if (data.event === "didReceiveSettings") { settings = (data.payload || {}).settings || {}; apply(); }
      };
      fields.forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () {
          settings[id] = this.type === "number" ? (this.value === "" ? null : Number(this.value)) : this.value;
          save();
          syncCustom();
        });
      });
    }
    function apply() {
      fields.forEach(function (id) {
        if (settings[id] !== undefined && settings[id] !== null) document.getElementById(id).value = settings[id];
      });
      syncCustom();
    }
    function syncCustom() {
      var custom = document.getElementById("palette").value === "custom";
      Array.prototype.forEach.call(document.querySelectorAll(".custom"), function (n) { n.hidden = !custom; });
    }
    function save() {
      if (websocket && websocket.readyState === 1) websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
    }
  </script>
</body>
</html>
